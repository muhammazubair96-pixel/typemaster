<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account — TypeMaster</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><a class="logo" href="index.html">Type<span>Master</span></a><nav><a href="index.html">Home</a><a href="levels.html">Levels</a><a href="about.html">About</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></nav></div></header>
<main class="auth-page"><section class="auth-card"><div class="auth-badge">TYPEMASTER ACCOUNT</div><h1>Create your account</h1><p>Save your progress and continue improving your typing.</p><form data-auth-form="signup"><label>Full name<input id="signupName" type="text" autocomplete="name" required placeholder="Your name"></label><label>Email<input id="signupEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></label><label>Confirm password<input id="signupConfirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your password"></label><button id="signupBtn" class="primary auth-submit" type="submit">Create Account</button></form><div id="authMessage" class="auth-message" hidden></div><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></body></html>
